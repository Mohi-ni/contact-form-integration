<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Contact Us</h1>
      <p class="muted">Send us your enquiry and we will get back to you.</p>

      <form id="contactForm" novalidate>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" minlength="2" maxlength="80" required>
        <small class="error" id="nameError"></small>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" maxlength="254" required>
        <small class="error" id="emailError"></small>

        <label for="message">Message</label>
        <textarea id="message" name="message" minlength="10" maxlength="2000" required></textarea>
        <small class="error" id="messageError"></small>

        <button type="submit" id="submitButton">Send Enquiry</button>
        <p id="formMessage" class="form-message"></p>
      </form>

      <a class="admin-link" href="/admin.html">Admin Dashboard</a>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
